<!DOCTYPE html>
<html lang="zh-CN">
	<head>
		<meta charset="utf-8">
		<title>张玮鞋城 -登录-</title>
		<link rel="stylesheet" href="css/login.css">
	</head>
	<body>
		<!-- 顶部Logo  -->
		<div class="header">
			<div class="top">
				<div class="topleft">
					<div class="logo">
						<img src="img/logo.jpg" alt="" />
						<span class="logo-text">张玮的运动鞋商店</span>
					</div>
				</div>
			</div>
		</div>


		<div class="bigmain">
			<img class="ad" src="img/register.jpg" alt="广告图" />

			<div id="main">
				<h1>用户登录</h1>

				<!-- 登录 -->
				<div class="tabs">
					<span class="active">密码登录</span>
					<span>验证码登录</span>
				</div>

				<!-- 账号输入框 -->
				<div class="form-item">
					<label>登录方式：</label>
					<input type="text" placeholder="请输入手机号/用户名/邮箱" class="form-input">
				</div>

				<!-- 密码输入框 -->
				<div class="form-item password">
					<label>密码：</label>
					<input type="password" placeholder="请输入密码" class="form-input">

				</div>

				<!-- 同意协议行 -->
				<div class="form-item agree">
					<span>
						<input type="checkbox" id="agree" name="agree">
						<label for="agree">我已阅读并同意<a href="#">《用户服务协议》</a>和<a href="#">《隐私政策》</a></label>
					</span>
				</div>

				<!-- 登录按钮 -->
				<div class="form-item">
					<button class="register-btn login-btn">登录</button>
				</div>

				<!-- 辅助链接组 -->
				<div class="link-wrap">
					<a href="#">忘记密码</a>
					<a href="file:///C:/Users/Lenovo/Desktop/shoesstore55122406341/login.html">免费注册</a>
				</div>

				<!-- 第三方登录 -->
				<div class="third-login">
					<div class="third-title">其他登录方式</div>
					<div class="third-icons">
						<img src="img/others (2).png" alt="微信登录">
						<img src="img/others (4).png" alt="支付宝登录">
						<img src="img/others (1).png" alt="QQ登录">
						<img src='img/others (3).png' alt="微博登录">
					</div>
				</div>
			</div>
		</div>

		<footer>
			<div class="bigfooter">
				<div class="footer-massage">
					张玮的运动鞋商店 © 55122406341版权所有 | ZJBC备20251226 41号
				</div>
			</div>
		</footer>
	</body>
</html>
