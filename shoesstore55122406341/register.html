<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <title>张玮鞋城 -注册-</title>
    <link rel="stylesheet" href="css/register.css">
</head>
<body>

    <div class="header">
        <div class="top">
            <div class="topleft">
                <div class="logo">
                    <img src="img/logo.jpg" alt="张玮的运动鞋商店"/>
                    <span class="logo-text">张玮的运动鞋商店</span>
                </div>
            </div>
        </div>
    </div>


    <div class="bigmain">
        <img class="ad" src="img/register.jpg" alt=""/>

        <div id="main">
            <h1>立即注册</h1>
            

            <div class="form-item">
                <label>用户名：</label>
                <input type="text" placeholder="用户名" class="form-input">
            </div>


            <div class="form-item">
                <label>密码：</label>
                <input type="password" placeholder="密码" class="form-input">
            </div>


            <div class="form-item">
                <label>密码确认：</label>
                <input type="password" placeholder="密码确认" class="form-input">
            </div>

            <!-- 性别单选框 -->
            <div class="form-item">
                <label>性别：</label>
                <div class="radio-group">
                    <span><input type="radio" name="gender" checked/>女</span>
                    <span><input type="radio" name="gender"/>男</span>
                </div>
            </div>


            <div class="manychoose">
                <span>
                    <label>需求：</label>
                    <div class="hobby">
                        <span><input type="checkbox" name="hobby" />运动</span>
                        <span><input type="checkbox" name="hobby"/>穿搭</span>
                        <span><input type="checkbox" name="hobby" />送人</span>
                        <span><input type="checkbox" name="hobby" />收藏</span>
                        <span><input type="checkbox" name="hobby"/>改造</span>
						<span><input type="checkbox" name="hobby"/>爱好</span>
						<span><input type="checkbox" name="hobby"/>展示</span>
                        <span><input type="checkbox" name="hobby" />其他</span>
                    </div>
                </span>
            </div>


            <div class="form-item">
                <label>语言：</label>
                <div >
                    <select name="major" id="major" class="form-select">
                        <option value="中文简体">中文简体</option>
                        <option value="English">English</option>
                        <option value="Français">Français</option>
                    </select>
                    <input type="button" value="同意并注册" class="register-btn login-btn">
                </div>
            </div>
        </div>
    </div>


    <footer>
        <div class="bigfooter">
            <div class="footer-massage">
                张玮的运动鞋商店 © 55122406341版权所有 | ZJBC备20251226 41号
            </div>
        </div>
    </footer>
</body>
</html>
